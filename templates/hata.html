<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hata</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { 
            padding: 20px; 
            background-color: #f8f9fa; 
        }
        .content-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .content-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        .nav-container {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Navigasyon Menüsü -->
        <div class="nav-container">
            <nav class="navbar navbar-expand-lg navbar-light bg-light rounded">
                <div class="container-fluid">
                    <span class="navbar-brand">Fraud Yönetim Sistemi</span>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="{{ url_for('kayit_ekle') }}">Vaka Kayıt</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{{ url_for('vakalar') }}">Vakalar</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{{ url_for('fraud_trend') }}">Fraud Trend Analizi</a>
                            </li>
                            {% if session.get('admin_giris') %}
                            <li class="nav-item">
                                <a class="nav-link" href="{{ url_for('kullanici_yonetimi') }}">Kullanıcı Yönetimi</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{{ url_for('admin_panel') }}">Admin Paneli</a>
                            </li>
                            {% endif %}
                        </ul>
                        <a href="{{ url_for('cikis') }}" class="btn btn-outline-danger">Çıkış</a>
                    </div>
                </div>
            </nav>
        </div>

        <!-- Hata Mesajı -->
        <div class="content-section">
            <div class="text-center mb-4">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 5rem;"></i>
            </div>
            <h2 class="text-center text-danger">Bir Hata Oluştu</h2>
            <div class="alert alert-danger">
                <p class="mb-0">{{ hata }}</p>
            </div>
            <div class="text-center mt-4">
                <a href="{{ url_for('vakalar') }}" class="btn btn-primary me-2">
                    <i class="bi bi-arrow-left"></i> Vakalar Sayfasına Dön
                </a>
                <a href="{{ url_for('menu') }}" class="btn btn-secondary">
                    <i class="bi bi-house"></i> Ana Sayfaya Dön
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
