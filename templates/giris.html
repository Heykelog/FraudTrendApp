<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Yönetim Sistemi - Giriş</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #f5f5f5;
        }
        .form-signin {
            width: 100%;
            max-width: 330px;
            padding: 15px;
            margin: auto;
        }
        .form-signin .checkbox {
            font-weight: 400;
        }
        .form-signin .form-floating:focus-within {
            z-index: 2;
        }
        .form-signin input[type="password"] {
            margin-bottom: 10px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }
        .form-signin img {
            width: 72px;
            height: 72px;
            margin-bottom: 1rem;
        }
        .form-select {
            margin-bottom: 1rem;
        }
        .btn-group {
            width: 100%;
            margin-bottom: 1rem;
        }
        .alert {
            margin-top: 1rem;
        }
    </style>
</head>
<body class="text-center">
    <main class="form-signin">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <img class="mb-4" src="{{ url_for('static', filename='logo.png') }}" alt="Logo" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22100%22%20height%3D%22100%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%20preserveAspectRatio%3D%22none%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23007bff%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%20font-family%3D%22sans-serif%22%20font-size%3D%2220px%22%3EFraud%3C%2Ftext%3E%3C%2Fsvg%3E'">
            
            <h1 class="h3 mb-3 fw-normal">Fraud Yönetim Sistemi</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            {% if hata %}
            <div class="alert alert-danger" role="alert">
                {{ hata }}
            </div>
            {% endif %}

            <div class="btn-group" role="group">
                <input type="radio" class="btn-check" name="giris_tipi" id="normal_giris" autocomplete="off" value="normal" checked>
                <label class="btn btn-outline-primary" for="normal_giris">Normal Giriş</label>
                
                <input type="radio" class="btn-check" name="giris_tipi" id="admin_giris" autocomplete="off" value="admin">
                <label class="btn btn-outline-danger" for="admin_giris">Admin Giriş</label>
            </div>

            <div id="kullanici_secim_div">
                <select class="form-select" name="kullanici_secim" id="kullanici_secim">
                    <option value="">Kullanıcı Seçin</option>
                    {% for kullanici in kullanicilar %}
                    <option value="{{ kullanici.id }}">{{ kullanici.ad }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="sifre" name="sifre" placeholder="Şifre" required>
                <label for="sifre">Şifre</label>
            </div>
            
            <div id="admin_hidden_input" style="display: none;">
                <input type="hidden" name="admin_giris" value="1">
            </div>

            <button class="w-100 btn btn-lg btn-primary" type="submit">Giriş Yap</button>
            <p class="mt-5 mb-3 text-muted">&copy; 2025 Fraud Yönetim Sistemi</p>
        </form>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const normalGiris = document.getElementById('normal_giris');
            const adminGiris = document.getElementById('admin_giris');
            const adminHiddenInput = document.getElementById('admin_hidden_input');
            const sifreInput = document.getElementById('sifre');
            const kullaniciSecimDiv = document.getElementById('kullanici_secim_div');
            
            function updateGirisType() {
                if (adminGiris.checked) {
                    adminHiddenInput.style.display = 'block';
                    kullaniciSecimDiv.style.display = 'none';
                    sifreInput.placeholder = 'Admin Şifresi';
                } else {
                    adminHiddenInput.style.display = 'none';
                    kullaniciSecimDiv.style.display = 'block';
                    sifreInput.placeholder = 'Şifre';
                }
            }
            
            normalGiris.addEventListener('change', updateGirisType);
            adminGiris.addEventListener('change', updateGirisType);
            
            updateGirisType(); // Sayfa yüklendiğinde durumu güncelle
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
