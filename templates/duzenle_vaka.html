<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaka Düzenle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { 
            padding: 20px; 
            background-color: #f8f9fa; 
        }
        .content-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .content-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        .nav-container {
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-label {
            font-weight: 600;
        }
        .conditional-field {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Navigasyon Menüsü -->
        <div class="nav-container">
            <nav class="navbar navbar-expand-lg navbar-light bg-light rounded">
                <div class="container-fluid">
                    <span class="navbar-brand">Fraud Yönetim Sistemi</span>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="{{ url_for('menu') }}"><i class="bi bi-house-door"></i> Ana Sayfa</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{{ url_for('kayit_ekle') }}">Vaka Kayıt</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{{ url_for('vakalar') }}">Vakalar</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{{ url_for('fraud_trend') }}">Fraud Trend Analizi</a>
                            </li>
                            {% if session.get('admin_giris') %}
                            <li class="nav-item">
                                <a class="nav-link" href="{{ url_for('admin_panel') }}">Admin Paneli</a>
                            </li>
                            {% endif %}
                        </ul>
                        <a href="{{ url_for('cikis') }}" class="btn btn-outline-danger">Çıkış</a>
                    </div>
                </div>
            </nav>
        </div>

        <!-- Geri Dönüş Butonu -->
        <div class="mb-3">
            <a href="{{ url_for('vaka_detay', vaka_index=vaka_index) }}" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i> Vaka Detayına Dön
            </a>
        </div>

        <!-- Düzenleme Formu -->
        <div class="content-section">
            <h2><i class="bi bi-pencil"></i> Vaka Düzenle</h2>
            
            <form method="POST" action="{{ url_for('duzenle_vaka', vaka_index=vaka_index) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row">
                    <!-- Sol Sütun -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <div class="row">
                                <div class="col-md-6">
                                    <label for="yil_secim" class="form-label">Yıl</label>
                                    <select class="form-select" id="yil_secim" name="yil_secim" required>
                                        {% for yil in ceyreklik_donemler.yillar %}
                                        <option value="{{ yil }}" {% if vaka['Çeyreklik Dönem'].startswith(yil|string) %}selected{% endif %}>{{ yil }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="ceyrek_secim" class="form-label">Çeyrek</label>
                                    <select class="form-select" id="ceyrek_secim" name="ceyrek_secim" required>
                                        {% for ceyrek in ceyreklik_donemler.ceyrekler %}
                                        <option value="{{ ceyrek }}" {% if ceyrek in vaka['Çeyreklik Dönem'] %}selected{% endif %}>{{ ceyrek }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <input type="hidden" id="ceyrek_donem" name="ceyrek_donem" value="{{ vaka['Çeyreklik Dönem'] }}">
                        </div>
                        
                        <div class="form-group">
                            <label for="vaka_turu" class="form-label">Vaka Türü</label>
                            <input type="text" class="form-control" id="vaka_turu" name="vaka_turu" value="{{ vaka['Vaka Türü'] }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="kanal" class="form-label">Kanal</label>
                            <select class="form-select" id="kanal" name="kanal" required>
                                <option value="Kart" {% if vaka['Kanal'] == 'Kart' %}selected{% endif %}>Kart</option>
                                <option value="Dijital Bankacılık" {% if vaka['Kanal'] == 'Dijital Bankacılık' %}selected{% endif %}>Dijital Bankacılık</option>
                                <option value="POS" {% if vaka['Kanal'] == 'POS' %}selected{% endif %}>POS</option>
                                <option value="Başvuru" {% if vaka['Kanal'] == 'Başvuru' %}selected{% endif %}>Başvuru</option>
                                <option value="Diğer" {% if vaka['Kanal'] == 'Diğer' %}selected{% endif %}>Diğer</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="ad_soyad_uye_isyeri" class="form-label">Ad-Soyad / Üye İş Yeri Adı</label>
                            <input type="text" class="form-control" id="ad_soyad_uye_isyeri" name="ad_soyad_uye_isyeri" value="{{ vaka['Ad-Soyad / Üye İş Yeri Adı'] }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="musteri_no_tckn_kart_no" class="form-label">Müşteri No / TCKN / Kart No</label>
                            <input type="text" class="form-control" id="musteri_no_tckn_kart_no" name="musteri_no_tckn_kart_no" value="{{ vaka['Müşteri No / TCKN / Kart No'] }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="sahte_islem_risk_tarihi" class="form-label">Sahte İşlem / Risk Tespiti Tarihi</label>
                            <input type="text" class="form-control" id="sahte_islem_risk_tarihi" name="sahte_islem_risk_tarihi" value="{{ vaka['Sahte İşlem / Risk Tespiti Tarihi'] }}" placeholder="GG-AA-YYYY" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="islem_turu" class="form-label">İşlem Türü</label>
                            <input type="text" class="form-control" id="islem_turu" name="islem_turu" value="{{ vaka['İşlem Türü'] }}">
                        </div>
                    </div>
                    
                    <!-- Sağ Sütun -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="kullanilan_tutar" class="form-label">Kullanılan Tutar (TL)</label>
                            <input type="number" step="0.01" class="form-control" id="kullanilan_tutar" name="kullanilan_tutar" value="{{ vaka['Kullanılan Tutar'] }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="musteri_zarari" class="form-label">Müşteri Zararı (TL)</label>
                            <input type="number" step="0.01" class="form-control" id="musteri_zarari" name="musteri_zarari" value="{{ vaka['Müşteri Zararı'] }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="banka_zarari" class="form-label">Banka Zararı (TL)</label>
                            <input type="number" step="0.01" class="form-control" id="banka_zarari" name="banka_zarari" value="{{ vaka['Banka Zararı'] }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="kurtarilan_tutar" class="form-label">Kurtarılan Tutar (TL)</label>
                            <input type="number" step="0.01" class="form-control" id="kurtarilan_tutar" name="kurtarilan_tutar" value="{{ vaka['Kurtarılan Tutar'] }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="inceleyen_kisi" class="form-label">İnceleyen Kişi</label>
                            <select class="form-select" id="inceleyen_kisi" name="inceleyen_kisi" required>
                                <option value="">Seçiniz</option>
                                <option value="Mi4biz" {% if vaka['İnceleyen Kişi'] == 'Mi4biz' %}selected{% endif %}>Mi4biz</option>
                                <option value="Şube" {% if vaka['İnceleyen Kişi'] == 'Şube' %}selected{% endif %}>Şube</option>
                                <option value="Diğer" {% if vaka['İnceleyen Kişi'] == 'Diğer' %}selected{% endif %}>Diğer</option>
                                {% for kullanici in kullanicilar %}
                                <option value="{{ kullanici.id }}" {% if vaka['İnceleyen Kişi'] == kullanici.ad %}selected{% endif %}>{{ kullanici.ad }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Kart kanalı için ek bilgiler -->
                <div id="kart_detay" class="mt-3 conditional-field {% if vaka['Kanal'] == 'Kart' %}d-block{% endif %}">
                    <div class="card mb-3">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">Kart Kanalı Ek Bilgileri</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="cpp_tespiti" class="form-label">CPP Tespiti</label>
                                        <select class="form-select" id="cpp_tespiti" name="cpp_tespiti">
                                            <option value="Seçiniz">Seçiniz</option>
                                            <option value="Evet" {% if vaka.get('CPP Tespiti') == 'Evet' %}selected{% endif %}>Evet</option>
                                            <option value="Hayır" {% if vaka.get('CPP Tespiti') == 'Hayır' %}selected{% endif %}>Hayır</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="pos_atm" class="form-label">POS/ATM</label>
                                        <select class="form-select" id="pos_atm" name="pos_atm">
                                            <option value="Seçiniz">Seçiniz</option>
                                            <option value="POS" {% if vaka.get('Pos/ATM') == 'POS' %}selected{% endif %}>POS</option>
                                            <option value="ATM" {% if vaka.get('Pos/ATM') == 'ATM' %}selected{% endif %}>ATM</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="kopyalama_onus_not_onus" class="form-label">Kopyalama Onus/Not Onus</label>
                                        <select class="form-select" id="kopyalama_onus_not_onus" name="kopyalama_onus_not_onus">
                                            <option value="Seçiniz">Seçiniz</option>
                                            <option value="Onus" {% if vaka.get('Kopyalama Onus/Not Onus') == 'Onus' %}selected{% endif %}>Onus</option>
                                            <option value="Not Onus" {% if vaka.get('Kopyalama Onus/Not Onus') == 'Not Onus' %}selected{% endif %}>Not Onus</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row mt-3">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="kopyalama_yeri_supheli_isyeri" class="form-label">Kopyalama Yeri/ Şüpheli İş yeri</label>
                                        <input type="text" class="form-control" id="kopyalama_yeri_supheli_isyeri" name="kopyalama_yeri_supheli_isyeri" value="{{ vaka.get('Kopyalama Yeri/ Şüpheli İş yeri', '') }}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="atm_kart_kopyalama_yontemi" class="form-label">ATM Kart Kopyalama Yöntemi</label>
                                        <input type="text" class="form-control" id="atm_kart_kopyalama_yontemi" name="atm_kart_kopyalama_yontemi" value="{{ vaka.get('ATM Kart Kopyalama Yöntemi', '') }}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Vaka Detayı ve Analist Notu -->
                <div class="row mt-3">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="vaka_detayi" class="form-label">Vaka Detayı</label>
                            <textarea class="form-control" id="vaka_detayi" name="vaka_detayi" rows="5">{{ vaka['Vaka Detayı'] }}</textarea>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="analist_notu" class="form-label">Analist Notu</label>
                            <textarea class="form-control" id="analist_notu" name="analist_notu" rows="5">{{ vaka['Analist Notu'] }}</textarea>
                        </div>
                    </div>
                </div>
                
                <!-- Butonlar -->
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('vaka_detay', vaka_index=vaka_index) }}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> İptal
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle"></i> Değişiklikleri Kaydet
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Yıl ve çeyrek seçimlerini birleştirip gizli alana yaz
        function birlesikCeyrekDonemiAyarla() {
            const yilSecim = document.getElementById('yil_secim').value;
            const ceyrekSecim = document.getElementById('ceyrek_secim').value;
            const ceyrekDonem = document.getElementById('ceyrek_donem');
            
            ceyrekDonem.value = yilSecim + '-' + ceyrekSecim;
            console.log("Çeyrek Dönem ayarlandı: " + ceyrekDonem.value);
        }

        // Sayfa yüklendiğinde tüm işlemleri burada yapıyoruz
        document.addEventListener('DOMContentLoaded', function() {
            const kanalSelect = document.getElementById('kanal');
            const kartDetayDiv = document.getElementById('kart_detay');
            const formElement = document.querySelector('form');
            
            // Kanal değişimi
            kanalSelect.addEventListener('change', function() {
                if (this.value === 'Kart') {
                    kartDetayDiv.style.display = 'block';
                } else {
                    kartDetayDiv.style.display = 'none';
                }
            });
            
            // İlk yüklemede kanal görünürlüğünü ayarla
            if (kanalSelect.value === 'Kart') {
                kartDetayDiv.style.display = 'block';
            } else {
                kartDetayDiv.style.display = 'none';
            }
            
            // İlk yüklemede çeyrek dönemi ayarla
            birlesikCeyrekDonemiAyarla();
            
            // Yıl ve çeyrek değişimlerinde çeyrek dönemi güncelle
            document.getElementById('yil_secim').addEventListener('change', birlesikCeyrekDonemiAyarla);
            document.getElementById('ceyrek_secim').addEventListener('change', birlesikCeyrekDonemiAyarla);
            
            // Form gönderilmeden önce çeyrek dönemi güncelle
            formElement.addEventListener('submit', function(e) {
                birlesikCeyrekDonemiAyarla();
            });
        });
    </script>
</body>
</html>
